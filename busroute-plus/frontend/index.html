<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BusRoute+ | Community-Verified TN Bus Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">B+</div>
      <div>
        <div class="brand-name">BusRoute+</div>
        <div class="brand-sub" data-i18n="tagline">Community-verified TN bus finder</div>
      </div>
    </div>

    <nav class="tabs" id="nav">
      <button data-view="find" class="active" data-i18n="navFind">Find Bus</button>
      <button data-view="live" data-i18n="navLive">Live Map</button>
      <button data-view="report" data-i18n="navReport">Report</button>
      <button data-view="insights" data-i18n="navInsights">Insights</button>
    </nav>

    <div class="top-right">
      <div class="trust" title="Your trust score">
        <span data-i18n="trust">Trust</span> <b id="trustValue">50</b>
      </div>
      <div class="lang" id="langToggle">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="ta">தமிழ்</button>
      </div>
    </div>
  </header>

  <!-- Map + sidebar (Find Bus and Live Map share the map) -->
  <main id="split" class="split">
    <aside class="side">
      <section id="side-find">
        <form id="searchForm" class="search" autocomplete="off">
          <div class="field-pair">
            <div class="pins"><span class="dot from"></span><span class="line"></span><span class="dot to"></span></div>
            <div class="inputs">
              <input id="fromInput" list="stopList" placeholder="From" data-i18n-ph="from" />
              <input id="toInput" list="stopList" placeholder="To" data-i18n-ph="to" />
            </div>
            <button type="button" class="swap" id="swapBtn" title="Swap">⇅</button>
          </div>
          <div class="row">
            <input id="routeInput" placeholder="Route no. (e.g. 21G)" data-i18n-ph="routeNo" />
            <button type="submit" class="primary" data-i18n="search">Search</button>
          </div>
          <datalist id="stopList"></datalist>
        </form>
        <div id="findBody"></div>
      </section>

      <section id="side-live" hidden>
        <div class="search">
          <input id="liveSearch" placeholder="Search routes, stops…" data-i18n-ph="searchRoutes" />
        </div>
        <div id="liveList"></div>
      </section>
    </aside>
    <div id="map"></div>
  </main>

  <!-- Report page -->
  <main id="view-report" class="page" hidden></main>

  <!-- Insights page -->
  <main id="view-insights" class="page" hidden></main>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
  
</body>
</html>
